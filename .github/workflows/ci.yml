name: CI – Build, Test & Release

on:
  push:
    branches: ["**"]        # build + test on every push
    tags:     ["v*"]        # AND create a GitHub Release when a vX.Y.Z tag is pushed
  pull_request:
    branches: ["**"]

permissions:
  contents: write           # needed by softprops/action-gh-release to create releases

jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # 1 · BUILD & TEST
  # ══════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Run Tests
    runs-on: windows-latest   # WPF requires Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore EasySave.sln

      - name: Build solution (Release)
        run: dotnet build EasySave.sln --configuration Release --no-restore

      - name: Run tests
        run: >
          dotnet test EasySave.Tests/EasySave.Tests.csproj
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage.cobertura.xml"

  # ══════════════════════════════════════════════════════════════════════════
  # 2 · PUBLISH CONSOLE v3.0  (only if tests pass)
  # ══════════════════════════════════════════════════════════════════════════
  publish-console:
    name: Publish Console v3.0
    runs-on: windows-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Console
        run: >
          dotnet publish EasySave.Views.Console/EasySave.Views.Console.csproj
          --configuration Release
          --output publish/console

      - name: Upload Console artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasySave-Console-v3
          path: publish/console/

  # ══════════════════════════════════════════════════════════════════════════
  # 3 · PUBLISH GUI v3.0  (only if tests pass)
  # ══════════════════════════════════════════════════════════════════════════
  publish-gui:
    name: Publish GUI v3.0
    runs-on: windows-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build CryptoSoft first (needed by GUI publish target)
        run: dotnet build CryptoSoft/CryptoSoft.csproj --configuration Release

      - name: Publish GUI
        run: >
          dotnet publish EasySave.Views.WPF/EasySave.Views.WPF.csproj
          --configuration Release
          --output publish/gui

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasySave-GUI-v3
          path: publish/gui/

  # ══════════════════════════════════════════════════════════════════════════
  # 4 · CREATE GITHUB RELEASE  (only on tag push, only if publish jobs pass)
  # ══════════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: [publish-console, publish-gui]
    if: startsWith(github.ref, 'refs/tags/v')   # only on vX.Y.Z tags

    steps:
      - name: Download Console artifact
        uses: actions/download-artifact@v4
        with:
          name: EasySave-Console-v3
          path: artifacts/console

      - name: Download GUI artifact
        uses: actions/download-artifact@v4
        with:
          name: EasySave-GUI-v3
          path: artifacts/gui

      - name: Zip Console build
        run: Compress-Archive -Path artifacts/console/* -DestinationPath EasySave-Console-${{ github.ref_name }}.zip

      - name: Zip GUI build
        run: Compress-Archive -Path artifacts/gui/* -DestinationPath EasySave-GUI-${{ github.ref_name }}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "EasySave ${{ github.ref_name }}"
          generate_release_notes: true     # auto-generates changelog from commits
          files: |
            EasySave-Console-${{ github.ref_name }}.zip
            EasySave-GUI-${{ github.ref_name }}.zip
